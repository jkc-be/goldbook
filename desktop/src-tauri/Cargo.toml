[package]
publish = false
license-file = "../../LICENSE"
name = "goldbook-desktop"
version = "0.1.13"
edition = "2021"
description = "Uploads World of Warcraft auction scans and character snapshots"
authors = ["jkc-be"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
goldbook-sync = { path = "../../crates/goldbook-sync" }
goldbook-core = { path = "../../crates/goldbook-core" }
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"
sha2 = "0.10"
hex = "0.4"
dirs = "6"
anyhow = "1"
rand = "0.9"
base64 = "0.22"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
minisign-verify = "0.3"
semver = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[dev-dependencies]
tempfile = "3"
goldbook-server = { path = "../../crates/goldbook-server" }
axum = "0.8"
