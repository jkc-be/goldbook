[package]
publish = false
license-file = "../../LICENSE"
name = "goldbook-desktop"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
description = "Uploads World of Warcraft auction scans and character snapshots"
authors = ["jkc-be"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
goldbook-sync.workspace = true
goldbook-core.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
reqwest.workspace = true
url.workspace = true
sha2.workspace = true
hex.workspace = true
dirs.workspace = true
anyhow.workspace = true
rand.workspace = true
base64.workspace = true
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
minisign-verify = "0.3"
semver = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[dev-dependencies]
tempfile.workspace = true
goldbook-server.workspace = true
axum.workspace = true
