[workspace]
members = ["crates/goldbook-core", "crates/goldbook-sync", "crates/goldbook-server", "desktop/src-tauri"]
default-members = ["crates/goldbook-core", "crates/goldbook-sync", "crates/goldbook-server"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.23.1"
dirs = "7"
goldbook-core = { path = "crates/goldbook-core" }
goldbook-server = { path = "crates/goldbook-server" }
goldbook-sync = { path = "crates/goldbook-sync" }
hex = "0.4"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = "1"
url = "2"

[profile.release]
lto = "thin"
strip = true
