name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Deploy to OVH and Release build run these checks for the commit they ship.
  workflow_call:
    inputs:
      ref:
        description: The commit to check; empty checks the commit the caller runs on
        type: string
        default: ''

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python3 scripts/check-secrets.py

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - run: make check

  desktop-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev
      - name: Test desktop authentication and the optimized GLib iterator
        run: cargo test --locked -p goldbook-desktop

  local-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Build and verify the OVH stack locally
        run: python3 scripts/dev.py up
      - name: Show container logs on failure
        if: failure()
        run: timeout 10s python3 scripts/dev.py logs || true
      - name: Stop the local stack
        if: always()
        run: python3 scripts/dev.py down

  # Installer builds use macOS and Windows runners, which cost more, so they run
  # only when someone starts this workflow by hand. A called workflow sees its
  # caller's name and event, so Deploy to OVH and Release build skip them:
  # https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations
  desktop:
    if: github.workflow == 'Check' && github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-24.04
            bundles: deb,rpm
    uses: ./.github/workflows/desktop.yml
    with:
      runner: ${{ matrix.os }}
      bundles: ${{ matrix.bundles }}
