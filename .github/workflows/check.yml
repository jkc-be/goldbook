name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Deploy to OVH runs these checks for the commit it ships.
  workflow_call:

permissions:
  contents: read

jobs:
  # Heavy jobs are skipped when the diff cannot affect them. A skipped job
  # reports success, so the required checks still pass. If this job fails,
  # those jobs run.
  paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.decide.outputs.desktop }}
      stack: ${{ steps.decide.outputs.stack }}
      test: ${{ steps.decide.outputs.test }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: decide
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 scripts/ci-paths.py

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python3 scripts/check-secrets.py

  test:
    needs: paths
    if: ${{ !cancelled() && (needs.paths.result != 'success' || needs.paths.outputs.test == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - run: make check

  desktop-tests:
    needs: paths
    if: ${{ !cancelled() && (needs.paths.result != 'success' || needs.paths.outputs.desktop == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev
      - name: Test desktop authentication and the optimized GLib iterator
        run: cargo test --locked -p goldbook-desktop

  local-stack:
    needs: paths
    if: ${{ !cancelled() && (needs.paths.result != 'success' || needs.paths.outputs.stack == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      # Battle.net is never called: the check writes its own session.
      - name: Configure a test Battle.net client
        run: printf 'BNET_CLIENT_ID=ci-client\nBNET_CLIENT_SECRET=ci-secret\nGOLDBOOK_PUBLIC_URL=http://localhost:8080/goldbook\n' > server/.env.local
      - name: Build and verify the OVH stack locally
        run: python3 scripts/dev.py up --signed-in
      - name: Show container logs on failure
        if: failure()
        run: timeout 10s python3 scripts/dev.py logs || true
      - name: Stop the local stack
        if: always()
        run: python3 scripts/dev.py down

  # Installer builds use macOS and Windows runners, which cost more, so they run
  # only when someone starts this workflow by hand. A called workflow sees its
  # caller's name and event, so Deploy to OVH skips them:
  # https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations
  desktop:
    if: github.workflow == 'Check' && github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-24.04
            bundles: deb,rpm
    uses: ./.github/workflows/desktop.yml
    with:
      runner: ${{ matrix.os }}
      bundles: ${{ matrix.bundles }}
