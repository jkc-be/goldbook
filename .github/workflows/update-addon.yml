name: Publish addon update
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - addon/Goldbook/**
      - scripts/package-updates.py
      - .github/workflows/update-addon.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-addon-update
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'jkc-be/goldbook' && github.ref == 'refs/heads/main' && github.actor == 'jkc-be' && github.triggering_actor == 'jkc-be'
    environment: release-signing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.18'
          cache: npm
      - name: Check the addon before publishing
        run: |
          sudo apt-get update && sudo apt-get install -y luajit
          luajit addon/tests/run.lua
          luajit addon/tests/scanner.lua
          luajit addon/tests/sellers.lua
          luajit addon/tests/orderbook.lua
          luajit addon/tests/professions.lua
          luajit addon/tests/trades.lua
      - run: npm ci
      - run: python3 scripts/package-updates.py addon update-feed
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Goldbook-update-feed
          path: update-feed/
          retention-days: 7
  publish:
    needs: package
    uses: ./.github/workflows/publish-updates.yml
    secrets: inherit
