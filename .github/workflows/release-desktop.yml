name: Release desktop
run-name: Release Goldbook client from ${{ github.ref_name }}
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: release-goldbook-desktop
  cancel-in-progress: false
jobs:
  installers:
    if: github.repository == 'jkc-be/goldbook' && github.ref == 'refs/heads/main' && github.actor == 'jkc-be' && github.triggering_actor == 'jkc-be'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-24.04
            bundles: deb,rpm
    uses: ./.github/workflows/desktop.yml
    secrets: inherit
    with:
      runner: ${{ matrix.os }}
      bundles: ${{ matrix.bundles }}
      release: true
  feed:
    needs: installers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: Goldbook-updater-*
          path: signed-installers
      - run: python3 scripts/package-updates.py client update-feed --artifacts signed-installers
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Goldbook-update-feed
          path: update-feed/
          retention-days: 7
          compression-level: 0
  publish:
    needs: feed
    uses: ./.github/workflows/publish-updates.yml
    secrets: inherit
