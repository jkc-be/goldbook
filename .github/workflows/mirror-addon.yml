name: Mirror addon
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - addon/**
      - .github/workflows/mirror-addon.yml
permissions:
  contents: read
concurrency:
  group: mirror-addon
  cancel-in-progress: false
jobs:
  mirror:
    if: github.repository == 'jkc-be/goldbook' && github.ref == 'refs/heads/main' && github.actor == 'jkc-be' && github.triggering_actor == 'jkc-be'
    environment: addon-mirror
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Mirror the public upstream
        env:
          SSH_KEY: ${{ secrets.ADDON_MIRROR_SSH_KEY }}
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
        run: |
          umask 077
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/addon-mirror-key"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$RUNNER_TEMP/addon-known-hosts"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/addon-mirror-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/addon-known-hosts"
          git clone --depth 1 git@github.com:jkc-be/goldbook-addon.git mirror
          rsync -a --delete --exclude .git addon/ mirror/
          printf '{"repository":"jkc-be/goldbook","revision":"%s","path":"addon"}\n' "$REVISION" > mirror/upstream.json
          git -C mirror add -A
          if git -C mirror diff --cached --quiet; then exit 0; fi
          git -C mirror -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Sync addon from public Goldbook $REVISION"
          git -C mirror push origin HEAD:main
      - name: Remove mirror credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/addon-mirror-key" "$RUNNER_TEMP/addon-known-hosts"
