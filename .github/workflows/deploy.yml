name: Deploy to OVH
run-name: Deploy ${{ github.ref_name }} to OVH

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Validate the image and OVH access without changing the running service
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ovh-production-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jkc-be/goldbook-server

jobs:
  build-push:
    if: github.repository == 'jkc-be/goldbook' && github.ref == 'refs/heads/main' && github.actor == 'jkc-be' && github.triggering_actor == 'jkc-be'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.repository == 'jkc-be/goldbook' && github.ref == 'refs/heads/main' && github.actor == 'jkc-be' && github.triggering_actor == 'jkc-be'
    environment: production
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      - name: Configure deployment SSH identity
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/ovh_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/ovh_deploy" "$HOME/.ssh/known_hosts"
      - name: Deploy image and wait for health
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          operation=deploy
          if [ "$VERIFY_ONLY" = true ]; then operation=verify; fi
          printf '%s' "$REGISTRY_TOKEN" | ssh -T \
            -i "$HOME/.ssh/ovh_deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=12 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$operation $RUN_ID $REVISION"
          printf 'OVH operation `%s` passed for commit `%s`.\n' "$operation" "$REVISION" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove SSH credentials
        if: always()
        run: rm -f "$HOME/.ssh/ovh_deploy" "$HOME/.ssh/known_hosts"
