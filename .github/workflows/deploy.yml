name: Deploy to OVH
run-name: Deploy ${{ github.ref_name }} to OVH

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Validate the image and OVH access without changing the running service
        type: boolean
        default: true

permissions:
  contents: read

# Shared with Release promote, so a deploy and a promotion never interleave.
concurrency:
  group: goldbook-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jkc-be/goldbook-server

jobs:
  check:
    if: github.repository == 'jkc-be/goldbook' && github.ref == 'refs/heads/main' && github.actor == 'jkc-be' && github.triggering_actor == 'jkc-be'
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml

  build-push:
    if: github.repository == 'jkc-be/goldbook' && github.ref == 'refs/heads/main' && github.actor == 'jkc-be' && github.triggering_actor == 'jkc-be'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The helper deploys this digest; the tag can be repushed by a later run.
      - name: Record the image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir "$RUNNER_TEMP/server-image"
          jq -n --arg revision "$REVISION" --arg digest "$DIGEST" '{revision: $revision, digest: $digest}' \
            > "$RUNNER_TEMP/server-image/image.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Goldbook-server-image
          path: ${{ runner.temp }}/server-image/image.json
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.repository == 'jkc-be/goldbook' && github.ref == 'refs/heads/main' && github.actor == 'jkc-be' && github.triggering_actor == 'jkc-be'
    environment: production
    needs: build-push
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - uses: ./.github/actions/ovh
        with:
          operation: ${{ inputs.verify_only && 'verify' || 'deploy' }}
          run-id: ${{ github.run_id }}
          revision: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          host: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
