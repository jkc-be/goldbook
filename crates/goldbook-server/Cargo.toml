[package]
publish = false
license-file = "../../LICENSE"
name = "goldbook-server"
version = "0.2.5"
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
flate2.workspace = true
goldbook-core.workspace = true
hex.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["blocking", "json", "form"] }
rusqlite = { version = "0.39", features = ["bundled", "functions"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
url.workspace = true
