[package]
publish = false
license-file = "../../LICENSE"
name = "goldbook-sync"
version = "0.1.13"
edition = "2021"
[dependencies]
goldbook-core = { path = "../goldbook-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
notify = "8"
regex = "1"
fs2 = "0.4"
tempfile = "3"
[dev-dependencies]
axum = "0.8"
